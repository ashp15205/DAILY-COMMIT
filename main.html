<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DailyCommit</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="card">
  <div class="user-bar">
  <div class="user-info">
    <img id="userAvatar" alt="User avatar" />
    <span id="userName"></span>
  </div>

  <button id="logoutBtn" class="logout-btn">Logout</button>
</div>


  <header>
    <div>
      <h1>DailyCommit</h1>
      <p>Consistency over intensity</p>
    </div>
  </header>

  <!-- Stats -->
  <section class="stats">
    <div>
      <span class="label">Current Streak</span>
      <span class="value" id="currentStreak">0</span>
    </div>
    <div>
      <span class="label">Max. Streak</span>
      <span class="value muted" id="maxStreak">0</span>
    </div>
  </section>

  <section class="stats secondary">
    <div>
      <span class="label">Total Days</span>
      <span class="value small" id="totalDays">0</span>
    </div>
    <div>
      <span class="label">Questions</span>
      <span class="value small" id="totalQuestions">0</span>
    </div>
  </section>
  <p class="weekly" id="weeklyConsistency"></p>

  <!-- Today -->
  <div class="action">
  <input id="questionInput" type="number" min="0"
         placeholder="Questions solved today" />
  <p id="inputStatus" class="input-status"></p>
  <button id="checkInBtn" disabled>Done</button>
  
</div>

<div class="view-toggle">
  <button id="heatmapView" class="active">Heatmap</button>
  <button id="chartView">Trend</button>
</div>
<div class="view-container">

  <!-- Heatmap -->
<section class="calendar">
  <div class="calendar-scroll" id="calendar"></div>
</section>


  <!-- Chart -->
  <canvas id="dailyChart" class="chart hidden"></canvas>

</div>

  <!-- Footer -->
  <footer id="lastUpdated"></footer>
  <button id="downloadBtn" class="download-btn" title="Download snapshot">
  <img src="downloads.png" alt="Download" />
</button>


  <div id="heatmap-tooltip"></div>

</main>
<!-- Firebase Auth Guard -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="script.js"></script>   <!-- render defined FIRST -->

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyCyhdCaJBaMANyVnDjjjjN6CohTRFQ3QvM",
      authDomain: "dailycommit-44508.firebaseapp.com",
      projectId: "dailycommit-44508",
      appId: "1:702924822450:web:0dbc70d4ee1dae89d776ab"
    };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.db = db;
  window.firestoreHelpers = { doc, getDoc, setDoc };

  const logoutBtn = document.getElementById("logoutBtn");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    window.STORAGE_KEY = `dailycommit-${user.uid}`;
    document.getElementById("userAvatar").src =
      user.photoURL || "default-avatar.png";

    document.getElementById("userName").textContent =
      user.displayName || "User";

    await window.render();   // ✅ NOW render exists
  });

  logoutBtn.onclick = async () => {
    const ok = confirm("Log out from DailyCommit?");
    if (!ok) return;
    await signOut(auth);
    window.location.href = "index.html";
  };
</script>




</body>
</html>
